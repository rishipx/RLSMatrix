# Same schema, but no actor is the table owner, so NO_FORCE_RLS goes unnoticed.
name: Table owner under FORCE ROW LEVEL SECURITY (no owner actor)

actors:
  - id: reader
    role: reader
    claims:
      role: reader

probes:
  - id: reader-sees-public-rows-only
    actor: reader
    description: A reader gets the public row and not the private one.
    sql: SELECT id FROM app.ledger ORDER BY id;
    expected_rows:
      - [1]
