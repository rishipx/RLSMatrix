name: First-draft suite (happy paths only)

# A typical first attempt: it proves the app *works* for the owner, but never
# proves that anyone is *kept out*. It passes the baseline and still leaves
# most policy regressions undetected. Compare its mutation score with
# suite.yaml, which runs against the same schema.

actors:
  - id: alice
    role: authenticated
    sub: 11111111-1111-1111-1111-111111111111
    claims:
      role: authenticated

probes:
  - id: alice-can-read-her-document
    actor: alice
    description: Alice can read document 1.
    sql: SELECT id FROM public.documents WHERE id = 1;
    expected_rows:
      - [1]

  - id: alice-can-insert-her-own-document
    actor: alice
    description: The owner can create a row attributed to herself.
    sql: INSERT INTO public.documents (id, owner_id, body) VALUES (10, '11111111-1111-1111-1111-111111111111', 'temporary') RETURNING id;
    expected_rows:
      - [10]
